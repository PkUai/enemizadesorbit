/* Orbit 02: independent text, spacing and motion preferences. */
:root{--space:1;--card-padding:24px;--main-padding:34px;--brand-ink:#fff}
body[data-density="compact"]{--space:.78}
body[data-density="spacious"]{--space:1.24}
body:is([data-theme="dark"],[data-theme="ocean"],[data-theme="wine"],[data-theme="coffee"],[data-theme="midnight"]){--brand-ink:#211c2b}
.main{padding-left:calc(var(--main-padding)*var(--space));padding-right:calc(var(--main-padding)*var(--space))}
.card{padding:calc(var(--card-padding)*var(--space))}
.stack{gap:calc(18px*var(--space))}.grid2{gap:calc(20px*var(--space))}.grid3{gap:calc(18px*var(--space))}.grid4{gap:calc(16px*var(--space))}
.dashboard{gap:calc(22px*var(--space))}
.hero{padding:calc(30px*var(--space))}
.stat{padding:calc(18px*var(--space))}
.sectionhead{margin-bottom:calc(18px*var(--space));gap:10px}
.sectionhead h2{font-size:18px;line-height:1.25}
.sectionhead>.link{white-space:normal;text-align:right;max-width:90px;justify-content:flex-end;font-size:13px;line-height:1.2}
.sectionhead p{line-height:1.3}
.task{padding-top:calc(14px*var(--space));padding-bottom:calc(14px*var(--space))}
.task:first-child{padding-top:0}.task:last-child{padding-bottom:0}
.taskbody small{display:block;line-height:1.35;margin-top:3px}
.taskbody strong{line-height:1.3}
.task .btn{padding:6px 10px}.tasktime{font-size:11px;width:35px}
.task .subjectdot{width:3px}
.navitem{padding-top:calc(8px*var(--space));padding-bottom:calc(8px*var(--space));line-height:1.22;gap:9px}
.navgroup{margin-top:calc(20px*var(--space));font-size:10px;letter-spacing:1.5px}
.navitem .navbadge{font-size:9px;letter-spacing:0;padding:2px 3px}
.navitem>span:not(.navbadge){min-width:0}
.sidebar{padding-top:25px}.brand{padding-bottom:22px}.brand strong{font-size:19px}
.brandmark{flex-shrink:0}
.shortcut{padding:calc(18px*var(--space))}
.shortcut strong{line-height:1.3}.shortcut small{display:block;line-height:1.35;margin-top:3px}
.rankrow{padding-top:calc(11px*var(--space));padding-bottom:calc(11px*var(--space));line-height:1.3;gap:8px}
.rankrow .pts{white-space:nowrap}
.sessionline{padding-top:calc(13px*var(--space));padding-bottom:calc(13px*var(--space))}
.sessionline>div{min-width:0}.sessionline h3{font-size:13px}.sessionline p{line-height:1.35}
.listline{padding-top:calc(16px*var(--space));padding-bottom:calc(16px*var(--space))}
.community-banner{padding:calc(20px*var(--space));gap:14px}.community-banner .btn{flex-shrink:0}
.metrichead{line-height:1.3}.metricfooter{font-size:11px;line-height:1.25;gap:7px}
.metricfooter .link{font-size:11px!important}.profiletop small{line-height:1.4}.stat small{display:block;line-height:1.25}
.stat strong{line-height:1.2}.stat .statlabel{line-height:1.2;gap:5px}
.hero p{line-height:1.5}.section-note{line-height:1.4;flex-wrap:wrap}
.breadcrumb{font-size:13px}.searchwrap input{font-size:13px}
.option{font-size:15px;line-height:1.5}.question{font-size:17px;line-height:1.7}
.notice{font-size:13px;line-height:1.55}.bubble{font-size:14px;line-height:1.6}
.setting-description{flex:1;min-width:0}.setting-description p{font-size:13px;line-height:1.5}
.density-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.density-choice{border:1px solid var(--border);border-radius:14px;background:var(--card);padding:14px 10px;text-align:left;min-width:0}
.density-choice.active{background:var(--tint);border-color:var(--accent)}
.density-choice strong{font-size:14px;display:block;margin:11px 0 4px}
.density-choice small{font-size:12px;color:var(--muted);display:block;line-height:1.35}
.density-preview{display:flex;flex-direction:column;justify-content:center;height:64px;background:var(--soft);border-radius:8px;padding:9px;gap:5px}
.density-preview i{display:block;min-height:5px;border:1px solid color-mix(in srgb,var(--accent) 28%,var(--border));background:var(--card);border-radius:3px;flex:1}
.density-preview.compact{gap:2px;padding:6px}.density-preview.spacious{gap:9px;padding:11px}
.type-sample{margin-top:18px;padding:20px;border:1px solid var(--border);border-radius:14px;background:var(--soft)}
.type-sample h2{font-size:27px;line-height:1.2;margin:10px 0}.type-sample p{font-size:14px;color:var(--muted);margin-bottom:15px}

   {transform:'scale(1)',filter:'blur(0px)',opacity:1,offset:1}
  ],{duration:310,delay:Math.min(i*12,48),easing:'cubic-bezier(.22,.75,.25,1)'});
 });
 const newHead=content.querySelector('.pagehead');
 if(newHead)arrivals.push(playPageAnimation(newHead,[{opacity:0,transform:'translateY(3px)'},{opacity:1,transform:'none'}],{duration:220,easing:'ease-out'}));
 await Promise.all(arrivals);
 if(epoch!==navigationEpoch)return;
 for(const a of pageAnimations)a.cancel();pageAnimations=[];
 finishNavigation();
}

function ranking(){return head('Ranking da temporada.','Progresso individual e competição entre enemizades.',btn('Critérios de premiação','onclick="rewardInfo()"','','shield'))+`<div class="dashboard"><section class="card">${section('Classificação geral','Pontuação fictícia para testar a interface')}<div class="row wrap mb"><span class="pill purple">Geral</span><span class="pill">Temporada de demonstração</span></div>${ranks(true)}<div class="notice mt">Todas as questões contam no progresso. Para premiações, o excedente de questões não validadas acima de 10% do total é desconsiderado.</div></section><aside class="stack"><section class="card" style="text-align:center"><div class="medal">1º</div><h2 class="serif mt" style="font-size:28px">Marina</h2><p class="muted small">Liderança da temporada · exemplo</p><strong style="display:block;font-size:26px;margin:13px">14.230 <span class="muted small">pontos</span></strong></section><section class="card"><h3>Premiações</h3><p class="muted small mt">Prêmios, calendário e critérios complementares serão definidos pela organização.</p><span class="pill mt">Nenhuma premiação anunciada</span></section></aside></div>`}
function coliseum(){return head('Coliseu.','Mesmas questões. Mesmo tempo. Resultados para comparar.')+`<section class="hero mb"><div class="hero-text"><div class="eyebrow">PARTIDAS ENTRE ENEMIZADES</div><h2 class="serif">Escolha seu desafio.</h2><p>As respostas das partidas também participam da pontuação e da evolução.</p>${btn('Configurar partida','onclick="matchSetup()"','primary','swords')}</div><div class="orbit-art" aria-hidden="true"><div class="ring"></div><div class="ring"></div><div class="core">${icon('swords')}</div><i class="planet"></i></div></section><div class="grid3">${[['Duelo','Convide uma enemizade para uma disputa individual.','swords'],['Partida em grupo','Uma sessão cronometrada para estudar e competir juntos.','users'],['Entre alianças','Um formato coletivo para futuras competições.','shield']].map(([t,p,ic])=>`<section class="card featurecard"><div class="iconbox">${icon(ic)}</div><h2>${t}</h2><p>${p}</p>${btn('Configurar',`onclick="matchSetup('${t}')"`,'soft','arrow')}</section>`).join('')}</div><div class="notice mt">As partidas desta prévia não conectam jogadores. A configuração serve para testar o fluxo visual.</div>`}
function sessions(){return head('Sessões de estudo.','Seu desempenho e o do grupo, no mesmo espaço.',`<span class="pill purple">${state.session?'Você está em uma sala local':'Salas demonstrativas'}</span>`)+`<div class="grid3 mb">${[['Banco de questões','4','book'],['Correção','2','pen'],['Outro','0','users']].map(([name,count,ic])=>`<section class="card featurecard"><div class="between" style="width:100%"><span class="iconbox">${icon(ic)}</span><span class="pill green"><i class="dot"></i>${count} na amostra</span></div><h2>${name}</h2><p>${name==='Banco de questões'?'Resolva questões e acompanhe a meta coletiva.':name==='Correção'?'Revise seus resultados em companhia.':'Um espaço para outras atividades de estudo.'}</p>${btn(state.session===name?'Sair da sala':'Entrar na sala',`onclick="joinSession('${name}')"`,state.session===name?'':'soft','arrow')}</section>`).join('')}</div>${state.session?`<div class="grid2"><section class="card">${section(state.session,'Sessão local de demonstração')}<div class="grid2">${stat('Seu desempenho','18','14 acertos · 4 erros','user')}${stat('Meta coletiva','64 / 100','Questões da amostra','users')}</div><div class="track mt"><div class="fill" style="--value:64%"></div></div><div class="section-note">${icon('eye','icon-sm')}Os participantes e resultados coletivos são fictícios.</div></section><section class="card">${section('Chat da sessão','Mensagens salvas apenas enquanto a página está aberta')}<div id="sessionlog" class="chatlog"><div class="bubble"><b>Marina</b><br>Vamos fechar a meta de hoje?</div></div><form class="chatinput" onsubmit="sendSession(event)"><input id="sessionmessage" placeholder="Converse com suas enemizades…" aria-label="Mensagem da sessão" required maxlength="500"><button class="btn primary" aria-label="Enviar">${icon('send')}</button></form></section></div>`:'<div class="notice">Escolha uma sala para experimentar o cartão de desempenho e o chat local. A atualização em tempo real fará parte da versão conectada.</div>'}`}
function alliances(){return head('Alianças e ligas.','Progresso compartilhado, competições e objetivos coletivos.')+`<div class="dashboard"><div class="stack"><section class="hero"><div class="hero-text"><span class="eyebrow">SUA ALIANÇA · [VEST]</span><h2 class="serif">Os Vestibulandos</h2><p>5 enemizades · Liga Prata<br>12.400 pontos nesta semana demonstrativa.</p>${btn('Ver integrantes','onclick="allianceMembers()"','soft','users')}</div><div class="orbit-art"><div class="ring"></div><div class="ring"></div><div class="core">${icon('shield')}</div></div></section><section class="card">${section('Aliança × Aliança','Competição semanal ilustrativa')}<div class="between mb"><h3>Os Vestibulandos</h3><strong>12.400</strong></div><div class="track"><div class="fill" style="--value:72%"></div></div><div class="between mt mb"><h3>Canetas em Ação</h3><strong>11.850</strong></div><div class="track"><div class="fill" style="--value:68%;background:var(--accent2)"></div></div><div class="section-note">Valores de demonstração. Regras de ligas ainda em planejamento.</div></section></div><aside class="stack"><section class="card" style="text-align:center"><div class="medal" style="background:var(--soft);color:var(--muted)">${icon('shield')}</div><h2 class="serif mt" style="font-size:31px">Liga Prata</h2><p class="muted small mt">3ª posição na liga de exemplo</p><div class="track mt"><div class="fill" style="--value:63%"></div></div><p class="muted small mt">Promoção e classificação a definir.</p></section><section class="card"><h3>Forme sua aliança</h3><p class="muted small mt">Nome, tag, descrição e seus integrantes.</p>${btn('Criar aliança','onclick="createAlliance()"','soft mt','shield')}</section></aside></div>`}
function synapse(){return head('Sua Sinapse.','Intensidade e continuidade dos estudos, além de uma sequência de dias.')+`<div class="grid2"><section class="card timercard"><span class="iconbox" style="margin:auto;background:var(--goldbg);color:var(--gold)">${icon('bolt')}</span><div class="timer" style="color:var(--gold)">76<span style="font-size:23px;color:var(--muted);letter-spacing:0"> / 100</span></div><p class="muted">Intensidade demonstrativa</p><div class="track mt" style="height:13px"><div class="fill synapse" style="--value:76%"></div></div><div class="between small muted mt"><span>0</span><span>20</span><span>40</span><span>60</span><span>80</span><span>100</span></div><p class="muted small mt">A Sinapse representa sua atividade de estudo. Os indicadores do plano são acompanhados separadamente.</p></section><section class="card">${section('Atividade recente','Visualização ilustrativa dos últimos sete dias')}<div class="bars">${['S','T','Q','Q','S','S','D'].map((d,i)=>`<div class="barcol"><i style="--v:${[40,65,48,85,76,15,5][i]}%;background:linear-gradient(0deg,#e99c64,#f4cf83)"></i><small>${d}</small></div>`).join('')}</div><div class="notice mt">Esta prévia preserva o conceito e o visual da Sinapse. Não simula sua fórmula de ganho ou decaimento.</div>${btn('Ver meu plano','data-go="plan"','soft mt','calendar')}</section></div>`}
function pomodoro(){return head('Um tempo para focar.','Pomodoro local com pausas e atividade vinculada.')+`<div class="grid2"><section class="card timercard"><div class="segment">${[['focus','Foco · 25 min'],['short','Pausa · 5 min'],['long','Pausa longa · 15 min']].map(([id,t])=>`<button class="${timerMode===id?'active':''}" onclick="setTimer('${id}')">${t}</button>`).join('')}</div><div class="timer" id="timerDisplay">25:00</div><p class="timerlabel">${timerMode==='focus'?'Tempo de concentração':'Tempo de pausa'}</p><div class="row mt">${btn(timerRunning?'Pausar':'Iniciar','onclick="toggleTimer()"','primary',timerRunning?'pause':'play')}${btn('Reiniciar','onclick="resetTimer()"','','refresh')}</div><div class="track" style="margin-top:30px"><div class="fill" id="timerProgress" style="--value:0%"></div></div></section><section class="card">${section('Atividade do bloco','Escolha onde colocar sua atenção')}<label for="timerActivity">Estudando agora</label><select id="timerActivity" style="width:100%" onchange="state.timerActivity=this.value;save()">${['Ecologia: relações ecológicas','Questões de Matemática','Revisão de erros','Estudo livre'].map(s=>`<option ${state.timerActivity===s?'selected':''}>${s}</option>`).join('')}</select><div class="notice mt">O relógio funciona enquanto este HTML está aberto, inclusive ao navegar pelas outras telas. Fechar a página encerra o timer.</div><div class="listline"><span class="iconbox">${icon('calendar')}</span><div><h3>Seu plano de hoje</h3><p>Continue a atividade prevista na rotina.</p></div><button class="circlebtn" data-go="plan" aria-label="Abrir plano">${icon('arrow')}</button></div></section></div>`}
function calculator(){return head('TRI e SISU.','Ferramentas distintas para acompanhar seus objetivos.')+`<div class="grid2"><section class="card">${section('Média ponderada · SISU','Cálculo local com notas e pesos informados')}<p class="muted small mb">Informe suas notas e os pesos do curso. O resultado não prevê aprovação nem consulta notas de corte.</p><form id="sisuForm" onsubmit="calcSisu(event)"><div style="display:grid;grid-template-columns:1fr 85px 65px;gap:10px;align-items:center"><span class="small muted">Área</span><label>Nota</label><label>Peso</label>${['Linguagens','Humanas','Natureza','Matemática','Redação'].map((t,i)=>`<label for="score${i}">${t}</label><input id="score${i}" aria-label="Nota de ${t}" type="number" min="0" max="1000" step="0.01" value="${[650,680,620,720,880][i]}" required><input id="weight${i}" aria-label="Peso de ${t}" type="number" min="0" max="100" step="0.1" value="1" required>`).join('')}</div><button class="btn primary mt" type="submit">Calcular média ${icon('calc','icon-sm')}</button></form><div id="sisuResult" class="notice mt">A média será calculada com os pesos que você informar.</div></section><section class="card featurecard"><div class="iconbox">${icon('chart')}</div><span class="pill">EM PLANEJAMENTO</span><h2>Estimativa de TRI</h2><p>A proposta é usar dados e parâmetros adequados às questões. Questões inéditas exigem calibração; uma dificuldade sugerida pela IA não equivale a uma TRI validada.</p><div class="notice">Nenhuma nota TRI é calculada nesta prévia. Metodologia e cobertura ainda serão definidas.</div>${btn('Ver simulados','data-go="sim"','soft','file')}</section></div>`}
function external(){const total=state.lots.reduce((s,l)=>s+l.correct+l.wrong,0)+Object.keys(state.answered).length;const valid=state.lots.filter(l=>l.status==='Validado').reduce((s,l)=>s+l.correct+l.wrong,0)+Object.keys(state.answered).length;const limit=Math.floor(total*.1);const eligible=valid+Math.min(total-valid,limit);return head('Questões de fora também contam.','Registre em lote e comprove agora ou posteriormente.',btn('Adicionar lote','onclick="externalForm()"','primary','upload'))+`<div class="grid3 mb">${stat('Questões registradas',total,'Somente registros desta prévia','book')}${stat('Validadas',valid,'Banco + lotes aprovados no teste','shield')}${stat('Elegíveis à premiação',eligible,'Quantidade segundo o limite de 10%','trophy')}</div><div class="notice mb">Todas contam para pontos e XP. Para premiações, contam as validadas e até 10% do total de questões sem validação. Só o excedente é excluído. O arredondamento para baixo nesta prévia é ilustrativo.</div><section class="card">${section('Seus registros','Demonstração local · nenhum comprovante será enviado')}<div class="table-scroll"><table class="data-table"><thead><tr><th>Origem</th><th>Acertos / erros</th><th>Questões</th><th>Validação</th><th>Ação</th></tr></thead><tbody>${state.lots.length?state.lots.map((l,i)=>`<tr><td>${esc(l.source)}<small class="muted" style="display:block">${esc(l.file||'Sem comprovante anexado')}</small></td><td>${l.correct} / ${l.wrong}</td><td>${l.correct+l.wrong}</td><td><span class="pill ${l.status==='Validado'?'green':l.status==='Em análise'?'purple':''}">${l.status}</span></td><td>${btn(l.status==='Em análise'?'Simular moderação':l.status==='Validado'?'Ver registro':'Enviar prova',`onclick="reviewLot(${i})"`,'sm','')}</td></tr>`).join(''):'<tr><td colspan="5"><div class="empty">Nenhum lote externo registrado.<br>Adicione um lote para testar o fluxo.</div></td></tr>'}</tbody></table></div></section><div class="grid3 mt">${[['upload','1. Enviar comprovante','Prints, fotos de provas ou dados de plataformas externas.'],['spark','2. Pré-análise por IA','Identificação inicial das informações e de possíveis inconsistências.'],['shield','3. Decisão da organização','Um moderador aprova ou recusa o comprovante.']].map(([ic,t,p])=>`<div class="card"><span class="iconbox mb">${icon(ic)}</span><h3>${t}</h3><p class="muted small mt">${p}</p></div>`).join('')}</div>`}
const themeNames={light:'Claro',cream:'Creme',rose:'Rosé','hzn-light':'HZN · Claro',forest:'Amazônia','hzn-dark':'HZN · Escuro',dark:'Escuro',ocean:'Oceano',wine:'Vinho',coffee:'Café',midnight:'Meia-noite'};const themeColors={light:'#f1edff',cream:'#ecdfc5',rose:'#f4d7e7','hzn-light':'linear-gradient(135deg,#fff 0 30%,#183a73 30% 65%,#ffcf24 65% 93%,#c93442 93%)',forest:'#19332b','hzn-dark':'linear-gradient(135deg,#0b142a 0 50%,#3764a3 50% 65%,#ffcf24 65% 93%,#ed6d7a 93%)',dark:'#242033',ocean:'#19344d',wine:'#542a43',coffee:'#513b2b',midnight:'#000'};
function settings(){return head('Do seu jeito.','Ajuste o espaço, a leitura e o movimento da interface.')+`<div class="grid2 settings-grid"><section class="card">${section('Densidade da interface','A mesma tipografia, com mais ou menos espaço.')}<div class="density-options" role="group" aria-label="Densidade da interface">${[['compact','Compacta','Mais conteúdo na tela'],['medium','Mediana','Padrão · espaço original'],['spacious','Ampliada','Mais espaço entre blocos']].map(([id,t,desc])=>`<button class="density-choice ${state.density===id?'active':''}" aria-pressed="${state.density===id}" onclick="setDensity('${id}')"><span class="density-preview ${id}" aria-hidden="true"><i></i><i></i><i></i></span><strong>${t}</strong><small>${desc}</small></button>`).join('')}</div><div class="section-note">A densidade altera os espaçamentos. O tamanho das fontes permanece o mesmo nas três opções.</div></section><section class="card">${section('Tema','Ícones e destaques acompanham a cor escolhida.')}<div class="swatches">${Object.entries(themeNames).map(([k,n])=>`<button class="swatch ${state.theme===k?'active':''}" onclick="setTheme('${k}')"><i style="--sw:${themeColors[k]}"></i>${n}</button>`).join('')}</div></section><section class="card">${section('Leitura','Traços levemente encorpados para facilitar a leitura')}<div class="listline"><div class="setting-description"><h3>Fontes em negrito</h3><p>Reforça os textos, títulos e controles.</p></div><button class="toggle ${state.bold?'on':''}" aria-label="Fontes em negrito" aria-pressed="${state.bold}" onclick="toggleBold()"></button></div><div class="type-sample"><span class="eyebrow">PRÉVIA DE LEITURA</span><h2 class="serif">Seu próximo conteúdo.</h2><p>Ecologia · relações ecológicas</p><span class="pill purple">Continuar estudos ${icon('arrow','icon-sm')}</span></div></section><section class="card">${section('Movimento e foco','Transições suaves entre as páginas')}<div class="listline"><div class="setting-description"><h3>Reduzir function profile(){return head('Filipe, sua evolução.','Uma visão do seu progresso e da sua participação.')+`<div class="dashboard"><div class="stack"><div class="grid3">${stat('Pontos',fmt(state.points),'Dados iniciais fictícios + teste','trophy')}${stat('XP acumulado',fmt(state.xp),'Valores demonstrativos','star')}${stat('Aproveitamento','78%','Indicador ilustrativo','chart')}</div><section class="card">${section('Conquistas','Exemplos de apresentação')}<div class="grid3">${[['book','Estudante de fato'],['bolt','Sinapse em atividade'],['users','Em boa companhia']].map(([ic,t])=>`<div style="padding:20px 10px;text-align:center;border:1px solid var(--border);border-radius:15px"><div class="iconbox" style="margin:0 auto 12px">${icon(ic)}</div><strong style="font-size:14px">${t}</strong><p class="muted small mt">Conquista ilustrativa</p></div>`).join('')}</div></section><section class="card">${section('Histórico de estudo','Dados desta demonstração')}<div class="listline"><span class="iconbox">${icon('book')}</span><div><h3>${Object.keys(state.answered).length} questões no banco de teste</h3><p>Respostas registradas automaticamente.</p></div></div><div class="listline"><span class="iconbox">${icon('upload')}</span><div><h3>${state.lots.length} lotes externos</h3><p>Validação e registro em lote.</p></div><button class="link" data-go="external">Ver registros</button></div></section></div><aside>${profileMini()}</aside></div>`}
const views={home,plan,bank,sim,essay,trails,library,ai,flashcards,ranking,coliseum,sessions,alliances,synapse,pomodoro,calculator,external,settings,profile};
function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('show');clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>$('#toast').classList.remove('show'),3600)}
function modal(title,sub,body){modalReturn=document.activeElement;$('#modalRoot').innerHTML=`<div class="modallayer" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="circlebtn close" aria-label="Fechar janela" onclick="closeModal()">${icon('x')}</button><h2 id="modalTitle">${title}</h2><p>${sub}</p>${body}</section></div>`;$('.modal .close').focus()}
function closeModal(){if(!$('#modalRoot').innerHTML)return;$('#modalRoot').innerHTML='';if(modalReturn?.isConnected)modalReturn.focus()}
function toggleFocus(){document.body.classList.toggle('focusmode');const on=document.body.classList.contains('focusmode');const b=document.querySelector('[onclick="toggleFocus(this)"]');b.setAttribute('aria-label',on?'Desativar modo foco':'Ativar modo foco');b.title=on?'Desativar modo foco':'Ativar modo foco';toast(on?'Modo foco ativado. Use o mesmo botão para sair.':'Modo foco desativado.')}
function toggleChat(){if(simActive){toast('Chat indisponível durante o simulado.');return;}$('#communitychat').classList.toggle('hidden');if(!$('#communitychat').classList.contains('hidden'))$('#communitymessage').focus()}
function appendMessage(target,message,mine=false){const d=document.createElement('div');d.className='bubble'+(mine?' mine':'');d.textContent=message;$(target).append(d);$(target).scrollTop=$(target).scrollHeight}
function sendCommunity(e){e.preventDefault();const input=$('#communitymessage');if(!input.value.trim())return;appendMessage('#communitylog',input.value,true);input.value=''}
function sendSession(e){e.preventDefault();const input=$('#sessionmessage');if(!input.value.trim())return;appendMessage('#sessionlog',input.value,true);input.value=''}
function toggleTask(i){state.tasks[i]=!state.tasks[i];save();render();toast(state.tasks[i]?'Atividade marcada como concluída.':'Atividade reaberta.')}
function showDay(btnEl,i){document.querySelectorAll('.day').forEach(d=>d.classList.remove('active'));btnEl.classList.add('active');$('#daytasks').innerHTML=i===4?taskList():`<div class="notice">${['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'][i]} · dia demonstrativo. ${i<5?'Revisão de conteúdos e prática de questões previstas.':'Dia livre na rotina de exemplo.'}</div>`}
function planWizard(){modal('Uma rotina para você.','Experimente a configuração. Nesta prévia, o plano é uma amostra e não é gerado por IA.',`<form onsubmit="savePlan(event)"><div class="formgrid"><div><label for="goal">Objetivo</label><select id="goal"><option ${state.planGoal==='ENEM'?'selected':''}>ENEM</option><option ${state.planGoal==='ENEM + vestibulares'?'selected':''}>ENEM + vestibulares</option><option ${state.planGoal==='Reforço escolar'?'selected':''}>Reforço escolar</option></select></div><div><label for="hours">Horas disponíveis por dia</label><input id="hours" type="number" min="0.5" max="12" step="0.5" value="${esc(state.planHours)}" required></div><div><label for="days">Dias de estudo por semana</label><select id="days">${[1,2,3,4,5,6,7].map(n=>`<option ${String(n)===String(state.planDays)?'selected':''}>${n}</option>`).join('')}</select></div><div><label for="difficulty">Maior dificuldade</label><select id="difficulty"><option>Matemática</option><option>Natureza</option><option>Linguagens</option><option>Humanas</option><option>Redação</option></select></div></div><label class="mt" for="routine">Sobre sua rotina</label><textarea id="routine" rows="3" placeholder="Horários de aula, compromissos e preferências…">${esc(state.routine||'')}</textarea><div class="notice mt">O plano terá indicadores próprios. A Sinapse continuará representando a intensidade dos estudos.</div><button class="btn primary mt">Salvar configuração de teste ${icon('check','icon-sm')}</button></form>`)}
function savePlan(e){e.preventDefault();state.planGoal=$('#goal').value;state.planHours=$('#hours').value;state.planDays=$('#days').value;state.routine=$('#routine').value;save();closeModal();go('plan');toast('Configuração salva. As atividades continuam sendo exemplos.')}
function chooseAnswer(i){selectedAnswer=i;render()}
function answerQuestion(){if(selectedAnswer===null){toast('Selecione uma alternativa.');return;}if(state.answered[currentQ]!==undefined)return;state.answered[currentQ]=selectedAnswer;const points=selectedAnswer===questions[currentQ].correct?10:5;state.points+=points;state.xp+=points;save();render();toast(`+${points} pontos e XP na prévia local.`)}
function nextQuestion(){let options=questions.map((q,i)=>i).filter(i=>questionSubject==='all'||questions[i].subject===questionSubject);currentQ=options[(options.indexOf(currentQ)+1)%options.length];selectedAnswer=null;render()}
function filterQuestions(s){questionSubject=s;currentQ=questions.findIndex(q=>s==='all'||q.subject===s);selectedAnswer=null;render()}
function showHint(full){$('#questionHint').innerHTML=`<b>${full?'Resolução de exemplo':'Dica de exemplo'}</b><br>${full?questions[currentQ].explanation:questions[currentQ].hint}`}
function coverage(){modal('Cobertura completa do ENEM.','Objetivo do acervo futuro. Os arquivos oficiais não estão incorporados a esta demonstração.',`<div class="stack">${['Provas regulares desde 1998','Reaplicações e ENEM PPL','Versões digitais publicadas','Identificação de aplicação, edição e língua estrangeira','Conferência de gabaritos, questões anuladas e duplicatas'].map(t=>`<div class="row">${icon('check','icon-sm')}<span>${t}</span></div>`).join('')}</div><div class="notice mt">Filtros previstos: prova, aplicação, ano, área, matéria, assunto, habilidade, situação de resposta e dificuldade quando disponível.</div>`)}
function customSim(){modal('Monte seu simulado.','Prévia de configuração. A geração por IA ainda não está conectada.',`<div class="formgrid"><div><label>Origem</label><select><option>Inéditas ENEMIZADES</option><option>Acervo oficial</option></select></div><div><label>Área</label><select><option>Todas as áreas</option><option>Matemática</option><option>Natureza</option></select></div><div><label>Quantidade</label><select><option>45 questões</option><option>90 questões</option><option>180 questões</option></select></div><div><label>Formato</label><select><option>Modelo ENEM</option><option>Prática por assunto</option></select></div></div><div class="notice mt">A futura geração terá revisão de gabaritos, enunciados e imagens antes da publicação.</div>${btn('Concluir configuração','onclick="closeModal();toast(\'Configuração demonstrativa. Nenhuma prova foi gerada.\')"','primary mt','check')}`)}
function startSim(){simActive=true;simDone=false;simAnswers=[];simIndex=0;simChoice=null;simDeadline=Date.now()+600000;$('#communitychat').classList.add('hidden');render()}
function selectSim(i){simChoice=i;render()}
function advanceSim(){if(simChoice===null){toast('Selecione uma resposta ou use Encerrar prova.');return;}simAnswers[simIndex]=simChoice;if(simIndex===3){finishSim();return;}simIndex++;simChoice=null;render()}
function finishSim(){if(!simActive)return;if(simAnswers[simIndex]===undefined)simAnswers[simIndex]=simChoice;while(simAnswers.length<4)simAnswers.push(null);simActive=false;simDone=true;closeModal();render()}
function confirmEndSim(){modal('Encerrar o simulado?','As questões ainda não respondidas aparecerão como não respondidas na correção.',`<div class="row">${btn('Continuar prova','onclick="closeModal()"','','')}${btn('Encerrar e corrigir','onclick="finishSim()"','primary','check')}</div>`)}

function essayPreview(){modal('Correção após o envio.','Demonstração da estrutura de feedback, sem avaliação do seu texto.',`<div class="notice mb">Não há uma nota calculada. Esta tela apresenta apenas o formato previsto para a correção.</div><div class="stack">${['Análise por competência','Trechos comentados','Pontos a desenvolver','Sugestões de reescrita'].map(t=>`<div class="row">${icon('pen','icon-sm')}<span>${t}</span><span class="pill" style="margin-left:auto">Aguardando integração</span></div>`).join('')}</div>`)}
function openTrail(i){const titles=['Relações ecológicas','Funções e gráficos','Leitura e interpretação'];const text=['Uma cadeia alimentar representa a transferência de matéria e energia entre organismos. Os produtores sintetizam matéria orgânica; consumidores obtêm alimento de outros organismos. Decompositores participam da reciclagem dos nutrientes.','Uma função associa cada elemento do domínio a um único valor no contradomínio. Em uma função afim, f(x) = ax + b, o coeficiente a indica a taxa de variação e b indica o valor de f(0).','Interpretar um texto envolve relacionar informações explícitas e implícitas. Antes de escolher uma alternativa, identifique o assunto, a finalidade do texto e os elementos que sustentam cada afirmação.'];modal(titles[i],'Conteúdo curto, autoral e demonstrativo.',`<span class="pill purple">Módulo de amostra</span><p style="font-family:Georgia,serif;font-size:20px;line-height:1.9;margin-top:20px">${text[i]}</p><div class="row wrap mt">${btn('Praticar questões','onclick="closeModal();go(\'bank\')"','primary','book')}${btn(state.contentDone?.includes(i)?'Concluído':'Marcar conteúdo estudado',`onclick="completeContent(${i})"`,'soft','check')}</div><div class="demo-note">Nesta prévia, marcar o conteúdo não atribui pontos: os valores dessa atividade ainda serão definidos.</div>`)}
function completeContent(i){state.contentDone=state.contentDone||[];if(!state.contentDone.includes(i))state.contentDone.push(i);save();closeModal();toast('Conteúdo marcado como estudado nesta prévia.')}
function filterResources(v){document.querySelectorAll('.resource').forEach(r=>r.classList.toggle('hidden',!r.dataset.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(v.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''))))}
function aiReply(i){const q=['Quero entender uma questão.','Quero revisar um assunto.','Quero organizar minha rotina.'];const a=['Exemplo de ajuda: primeiro, identifique o que a pergunta pede. Depois, separe os dados necessários. No banco de teste, você pode experimentar uma dica específica para cada questão.','Exemplo de revisão: tente explicar o conceito sem consultar o material. Identifique a parte em que você teve dificuldade e volte ao conteúdo correspondente.','Exemplo de planejamento: comece pelos dias e horários disponíveis. A tela Meu plano permite experimentar essa configuração; a personalização real por IA virá depois.'];appendMessage('#aiLog',q[i],true);appendMessage('#aiLog',a[i])}
function sendAI(e){e.preventDefault();let x=$('#aiMessage');if(!x.value.trim())return;appendMessage('#aiLog',x.value,true);x.value='';appendMessage('#aiLog','Mensagem recebida apenas nesta demonstração. Não há IA conectada para interpretar sua pergunta. Use as sugestões acima para conhecer os exemplos de interação.')}
function flashPreview(){modal('Um cartão de revisão.','Exemplo de interação do recurso futuro.',`<div id="flashcard" style="padding:45px 20px;text-align:center;background:var(--tint);border-radius:18px"><span class="eyebrow">ECOLOGIA · FRENTE</span><h2 class="serif" style="font-size:26px;margin-top:20px">Qual é o papel dos produtores em uma cadeia alimentar?</h2></div>${btn('Virar cartão','onclick="flipCard(this)"','primary mt','refresh')}`)}
function flipCard(b){$('#flashcard').innerHTML='<span class="eyebrow">ECOLOGIA · VERSO</span><p style="font-family:Georgia,serif;font-size:23px;margin-top:20px">Produzir matéria orgânica a partir de substâncias inorgânicas, formando a base da cadeia alimentar.</p>';b.disabled=true;b.textContent='Resposta exibida'}
function rewardInfo(){modal('Questões que contam para premiação.','Regra definida para o planejamento do ENEMIZADES.',`<p style="font-size:16px">Contam as questões validadas e até <b>10% do total registrado</b> sem validação. Somente o excedente não validado é desconsiderado para premiações.</p><div class="table-scroll mt"><table class="data-table" style="min-width:0"><thead><tr><th>Total</th><th>Validadas</th><th>Contam</th></tr></thead><tbody><tr><td>1.000</td><td>900</td><td>1.000</td></tr><tr><td>1.000</td><td>890</td><td>990</td></tr><tr><td>1.000</td><td>700</td><td>800</td></tr></tbody></table></div><div class="notice mt">Todas continuam contando no progresso pessoal. Premiações serão definidas pela organização. A escolha de quais acertos/erros compõem o limite e os arredondamentos ainda precisam de regra.</div>`)}
function matchSetup(mode='Duelo'){modal('Configurar partida.','Coliseu · demonstração visual sem conexão entre jogadores.',`<form onsubmit="event.preventDefault();closeModal();toast('Configuração concluída como demonstração. Nenhuma partida online foi criada.')"><div class="formgrid"><div><label>Modalidade</label><select>${['Duelo','Partida em grupo','Entre alianças'].map(x=>`<option ${mode===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Matéria</label><select><option>Todas as matérias</option><option>Matemática</option><option>Biologia</option></select></div><div><label>Quantidade</label><select><option>10 questões</option><option>5 questões</option><option>20 questões</option></select></div><div><label>Tempo total</label><select><option>20 minutos</option><option>10 minutos</option><option>30 minutos</option></select></div></div><div class="notice mt">Os participantes recebem as mesmas questões. As respostas contribuirão para pontos e XP.</div><button class="btn primary mt">Testar configuração ${icon('swords','icon-sm')}</button></form>`)}
function joinSession(n){state.session=state.session===n?'':n;save();render();toast(state.session?'Você entrou na sala de demonstração.':'Você saiu da sala.')}
function allianceMembers(){modal('Os Vestibulandos','[VEST] · integrantes fictícios',ranks(true))}
function createAlliance(){modal('Sua nova aliança.','Demonstração de configuração, sem criação no servidor.',`<form onsubmit="event.preventDefault();closeModal();toast('Configuração de aliança testada. Nenhuma aliança online foi criada.')"><div class="formgrid"><div><label>Nome</label><input required maxlength="40" placeholder="Nome da aliança"></div><div><label>Tag</label><input required maxlength="6" placeholder="Até 6 caracteres"></div></div><label class="mt">Descrição</label><textarea rows="3" placeholder="Conte um pouco sobre o grupo…"></textarea><button class="btn primary mt">Testar criação ${icon('shield','icon-sm')}</button></form>`)}
function setTimer(mode){timerMode=mode;timerTotal={focus:1500,short:300,long:900}[mode];timerRemaining=timerTotal;timerRunning=false;render()}
function toggleTimer(){if(timerRunning){timerRemaining=Math.max(0,Math.ceil((timerDeadline-Date.now())/1000));timerRunning=false}else{if(timerRemaining<=0)timerRemaining=timerTotal;timerDeadline=Date.now()+timerRemaining*1000;timerRunning=true}render()}
function resetTimer(){timerRunning=false;timerRemaining=timerTotal;render()}
function updateTimer(){if($('#timerDisplay')){$('#timerDisplay').textContent=String(Math.floor(timerRemaining/60)).padStart(2,'0')+':'+String(timerRemaining%60).padStart(2,'0');$('#timerProgress').style.width=(1-timerRemaining/timerTotal)*100+'%'}if($('#wordcount'))$('#wordcount').textContent=(state.essay?.trim()?state.essay.trim().split(/\s+/).length:0)+' palavras'}
setInterval(()=>{if(timerRunning){timerRemaining=Math.max(0,Math.ceil((timerDeadline-Date.now())/1000));if(timerRemaining===0){timerRunning=false;toast('Bloco concluído. Hora de uma pausa.');if(route==='pomodoro')render()}updateTimer()}if(simActive){const s=Math.max(0,Math.ceil((simDeadline-Date.now())/1000));if($('#simClock'))$('#simClock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(s===0){finishSim();toast('Tempo encerrado. Veja sua correção.')}}},500);
function calcSisu(e){e.preventDefault();let sum=0,w=0;for(let i=0;i<5;i++){sum+=Number($('#score'+i).value)*Number($('#weight'+i).value);w+=Number($('#weight'+i).value)}$('#sisuResult').textContent=w?'Média ponderada: '+(sum/w).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' pontos.':'Informe pelo menos um peso maior que zero.'}
function externalForm(){modal('Registrar questões externas.','Acertos e erros entram no progresso. A comprovação pode ser enviada agora ou depois.',`<form onsubmit="addLot(event)"><label for="lotSource">Onde você estudou?</label><input id="lotSource" style="width:100%" required maxlength="100" placeholder="Ex.: simulado da escola, plataforma, apostila"><div class="formgrid"><div><label for="lotCorrect">Acertos</label><input id="lotCorrect" type="number" min="0" max="10000" step="1" value="0" required></div><div><label for="lotWrong">Erros</label><input id="lotWrong" type="number" min="0" max="10000" step="1" value="0" required></div></div><div class="fileproof mt"><label for="proofFile">Comprovante (opcional)</label><span class="small muted">Print, foto ou arquivo de resultados. Nesta prévia, apenas o nome do arquivo é guardado.</span><input id="proofFile" type="file" accept="image/*,.pdf,.csv,.txt"></div><button class="btn primary mt">Registrar lote local ${icon('check','icon-sm')}</button></form>`)}
function addLot(e){e.preventDefault();const c=Number($('#lotCorrect').value),w=Number($('#lotWrong').value),source=$('#lotSource').value.trim();if(!source||!Number.isInteger(c)||!Number.isInteger(w)||c+w<1){toast('Informe a origem e pelo menos uma questão.');return;}const file=$('#proofFile').files[0]?.name||'';state.lots.push({source,correct:c,wrong:w,file,status:file?'Em análise':'Não validado'});state.points+=c*10+w*5;state.xp+=c*10+w*5;save();closeModal();render();toast('Lote registrado apenas nesta prévia.')}
function reviewLot(i){const l=state.lots[i];if(l.status==='Validado'){modal('Registro validado no teste.','Essa aprovação é apenas uma simulação local.',`<p>${esc(l.source)} · ${l.correct+l.wrong} questões.</p><div class="notice mt">Nenhum ponto adicional foi atribuído pela validação.</div>`);return;}if(l.status==='Em análise'){modal('Simulação de moderação.','Na plataforma real, somente moderadores poderão tomar a decisão.',`<p><b>${esc(l.source)}</b><br>${l.correct+l.wrong} questões · ${esc(l.file)}</p><div class="notice mt">A pré-análise por IA não está conectada. O arquivo não foi lido nem enviado nesta demonstração.</div><div class="row wrap mt">${btn('Simular aprovação',`onclick="decideLot(${i},true)"`,'primary','check')}${btn('Simular recusa',`onclick="decideLot(${i},false)"`,'','x')}</div>`);return;}modal('Enviar comprovação.','O lote já existe: a validação não duplicará a pontuação.',`<form onsubmit="attachProof(event,${i})"><div class="fileproof"><label for="proofFile">Print, foto ou dados externos</label><input id="proofFile" type="file" accept="image/*,.pdf,.csv,.txt" required></div><div class="notice mt">Nesta prévia, apenas o nome do arquivo é guardado no navegador.</div><button class="btn primary mt">Simular envio para análise ${icon('upload','icon-sm')}</button></form>`)}
function attachProof(e,i){e.preventDefault();state.lots[i].file=$('#proofFile').files[0].name;state.lots[i].status='Em análise';save();closeModal();render()}
function decideLot(i,yes){state.lots[i].status=yes?'Validado':'Comprovação recusada';save();closeModal();render();toast(yes?'Validação simulada. Pontos e XP não foram duplicados.':'Recusa simulada. Você pode enviar outra comprovação.')}
function setTheme(t){state.theme=t;save();applyPrefs();render()}
function setDensity(value){state.density=value;save();applyPrefs();render()}
function toggleBold(){state.bold=!state.bold;save();applyPrefs();render()}
function resetDemo(){modal('Restaurar a prévia?','Isso apaga somente os dados deste protótipo neste navegador, incluindo rascunho e lotes.',`<div class="row">${btn('Cancelar','onclick="closeModal()"','','')}${btn('Restaurar','onclick="performReset()"','primary','refresh')}</div>`)}
function performReset(){state=JSON.parse(JSON.stringify(defaults));save();closeModal();timerRunning=false;timerRemaining=1500;timerTotal=1500;applyPrefs();render();toast('Dados de teste restaurados.')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){go(b.dataset.go)}if(!e.target.closest('.searchwrap'))$('#searchresults').classList.add('hidden')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();menu(false);$('#communitychat').classList.add('hidden');$('#searchresults').classList.add('hidden')}if(e.key==='Tab'&&$('.modal')){const a=[...$('.modal').querySelectorAll('button,input,select,textarea,a[href]')].filter(x=>!x.disabled);const first=a[0],last=a[a.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
$('#search').addEventListener('input',e=>{const s=e.target.value.toLowerCase().trim();const matches=entries.filter(x=>x[2].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(s.normalize('NFD').replace(/[\u0300-\u036f]/g,'')));$('#searchresults').innerHTML=matches.length?matches.map(([id,ic,t])=>`<button data-go="${id}">${t}</button>`).join(''):'<div class="small muted" style="padding:10px">Nenhum recurso encontrado.</div>';$('#searchresults').classList.toggle('hidden',!s)});

const island=$('#orbitIsland'),islandToggle=$('#islandToggle'),islandPanel=$('#islandPanel');
let islandHover,islandLeave,islandNotice='',islandNoticeTimeout;
let islandSessionStart=state.session?Number(state.islandSessionStart)||Date.now():0;
const islandTime=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function expandIsland(open){clearTimeout(islandHover);clearTimeout(islandLeave);island.classList.toggle('open',open);islandToggle.setAttribute('aria-expanded',String(open));islandToggle.setAttribute('aria-label',open?'Recolher Ilha Dinâmica':'Expandir sessão e Pomodoro');islandPanel.inert=!open;if(!open){for(const id of ['islandPeopleTray','islandRoomTray']){const el=$('#'+id);el.classList.remove('open');el.inert=true}$('#islandSessionButton').setAttribute('aria-expanded','false');$('#islandMore')?.setAttribute('aria-expanded','false')}}
islandToggle.addEventListener('click',()=>expandIsland(!island.classList.contains('open')));
island.addEventListener('pointerenter',e=>{if(e.pointerType==='touch')return;clearTimeout(islandLeave);islandHover=setTimeout(()=>expandIsland(true),450)});
island.addEventListener('pointerleave',e=>{if(e.pointerType==='touch')return;clearTimeout(islandHover);islandLeave=setTimeout(()=>{if(!island.contains(document.activeElement))expandIsland(false)},650)});
island.addEventListener('focusout',()=>setTimeout(()=>{if(!island.contains(document.activeElement)&&!island.matches(':hover'))expandIsland(false)},0));
