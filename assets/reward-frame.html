<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENEMIZADES · Prévia de recompensas</title>
<style>
:root{color-scheme:dark;--bg:#090c18;--line:rgba(202,214,255,.13);--muted:#a0a9c5;--white:#f6f8ff;--accent:#9f8bff;--blue:#73bdff;--green:#82ecc4;--yellow:#ffd790}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#222144 0%,#0c1020 57%,#080b15 100%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--white);overflow-x:hidden}button{font:inherit;cursor:pointer}.stage{min-height:100dvh;display:grid;place-items:center;padding:90px 14px 35px;position:relative}.stage:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 48%,transparent 0%,rgba(6,8,18,.55) 70%);pointer-events:none}.switcher{position:fixed;z-index:10;top:15px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:5px;border:1px solid var(--line);background:#111629ef;backdrop-filter:blur(22px);border-radius:50px;box-shadow:0 12px 35px #0005;max-width:calc(100vw - 18px)}.switcher button{border:0;border-radius:30px;color:#bac1df;background:transparent;padding:10px 14px;font-size:12px;white-space:nowrap}.switcher button.active{background:#343453;color:white;box-shadow:inset 0 1px #ffffff24}.modal{position:relative;width:min(100%,490px);border:1px solid #ffffff25;border-radius:30px;background:linear-gradient(150deg,#1d233b 0%,#111629 42%,#101526 100%);box-shadow:0 25px 100px #000b,0 0 65px #7c67ea19,inset 0 1px 0 #fff2;overflow:hidden;isolation:isolate}.aurora{position:absolute;inset:-120px -60px auto;height:390px;background:radial-gradient(ellipse at 50% 45%,#a18aff28,transparent 62%);pointer-events:none;z-index:-1}.modal.lose .aurora{background:radial-gradient(ellipse at 50% 45%,#e06e9722,transparent 63%)}.modal.session .aurora{background:radial-gradient(ellipse at 50% 45%,#68b4ff24,transparent 63%)}.topline{padding:23px 27px 0;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:9px;color:#d5d9ee;font-size:10px;font-weight:800;letter-spacing:2px}.brandmark{display:grid;place-items:center;width:24px;height:24px;color:#e7dbff;border:1px solid #afa0ff77;border-radius:9px;background:#8b70ee2c;font-weight:900;font-size:14px;letter-spacing:0}.mini{font-size:10px;letter-spacing:1.2px;color:#8994b6;font-weight:700}.hero{padding:16px 25px 3px;text-align:center;position:relative}.ring{position:relative;width:114px;height:114px;margin:0 auto 15px;display:grid;place-items:center}.ring:before,.ring:after{content:"";position:absolute;inset:5px;border:1px solid #bcaaff61;transform:rotate(45deg);border-radius:32px}.ring:after{inset:16px;border-color:#eee6ff45;border-radius:24px;transform:rotate(12deg)}.medal{width:69px;height:69px;display:grid;place-items:center;border-radius:23px;background:linear-gradient(145deg,#a99afc40,#5d5dcc30);border:1px solid #b9a9ff90;filter:drop-shadow(0 0 25px #a48bff8b)}.medal svg{width:39px;height:39px;stroke:#e6dcff;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}.lose .medal{background:linear-gradient(145deg,#e4769e33,#71415c30);border-color:#f9aac377;filter:drop-shadow(0 0 20px #ed7e9c65)}.session .medal{background:linear-gradient(145deg,#7acbff33,#456b9930);border-color:#8bd5ff77;filter:drop-shadow(0 0 20px #74baff60)}.eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#b9addf;font-weight:800;margin-bottom:4px}.hero h1{font-size:clamp(37px,9vw,51px);letter-spacing:3px;font-weight:900;line-height:1.05;margin:0;background:linear-gradient(#fff,#cabaff);color:transparent;background-clip:text;text-shadow:0 0 45px #a891ff39}.lose .hero h1{background-image:linear-gradient(#fff,#e6a7bb)}.session .hero h1{font-size:clamp(29px,7.2vw,40px);letter-spacing:0;background-image:linear-gradient(#fff,#a6d9ff)}.hero p{color:#acb4d0;font-size:12px;margin:10px 0 13px}.scoreline{display:inline-flex;gap:10px;align-items:center;border-radius:99px;padding:7px 13px;background:#ffffff0b;border:1px solid #ffffff19;color:#cbd1e6;font-size:11px}.dot{width:5px;height:5px;border-radius:50%;background:#bdadff}.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:24px 25px 12px}.sectionTitle span{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#f0eefa}.sectionTitle small{font-size:10px;color:#838fac}.rewards{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:0 23px}.reward{position:relative;overflow:hidden;display:flex;align-items:center;gap:11px;min-height:81px;border-radius:17px;background:linear-gradient(125deg,#ffffff0d,#ffffff06);border:1px solid #ffffff16;padding:13px 12px;opacity:0;transform:translateY(20px) scale(.94)}.reward:nth-child(1){--c:#ddc4ff}.reward:nth-child(2){--c:#93c6ff}.reward:nth-child(3){--c:#9ceac7}.reward:nth-child(4){--c:#ffe2a2}.reward:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 0% 0%,color-mix(in srgb,var(--c),transparent 88%),transparent 72%);pointer-events:none}.rIcon{width:36px;height:36px;flex:0 0 36px;border-radius:12px;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--c),transparent 70%);background:color-mix(in srgb,var(--c),transparent 88%);color:var(--c)}.rIcon svg{width:29px;height:29px;stroke-linecap:round;stroke-linejoin:round}.rInfo{min-width:0}.rInfo small{display:block;font-size:10px;color:#adb6d1;margin-bottom:3px}.rInfo strong{font-size:22px;font-weight:800;white-space:nowrap;letter-spacing:-.9px;display:block}.rInfo em{font-style:normal;color:#7b87aa;font-size:9px}.details{margin:15px 23px 0;background:#0b1020a3;border:1px solid #ffffff13;border-radius:16px;overflow:hidden;opacity:0;transform:translateY(10px)}.detailsBtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:15px;background:transparent;color:#e5e7f7;border:0;padding:13px 15px;font-weight:750;font-size:12px;text-align:left}.detailsBtn span{display:flex;gap:9px;align-items:center}.chevron{width:14px;height:14px;transition:transform .2s}.details.open .chevron{transform:rotate(180deg)}.detailsBody{display:none;border-top:1px solid #ffffff12;padding:13px 15px 15px}.details.open .detailsBody{display:block}.calcRow{display:flex;justify-content:space-between;gap:12px;margin:9px 0;color:#aab3ce;font-size:11px}.calcRow b{color:#e9edff}.calcRow.total{border-top:1px solid #ffffff16;padding-top:12px;margin-top:12px;font-size:12px;color:white}.calcRow.total b{color:#acecce}.foot{padding:16px 23px 22px;display:grid;grid-template-columns:1fr auto;gap:10px;opacity:0;transform:translateY(10px)}.primary,.again{border:1px solid #b3a5ff72;background:linear-gradient(130deg,#a28bfa,#7864dd);border-radius:14px;color:white;padding:13px 18px;font-size:12px;font-weight:750;box-shadow:0 5px 25px #9175fa3b}.again{background:#ffffff10;border-color:#ffffff2b;box-shadow:none}.enter .ring{animation:rise .8s both,glow 3s 1s infinite ease-in-out}.enter .eyebrow{animation:rise .65s .28s both}.enter h1{animation:rise .7s .4s both}.enter .hero p,.enter .scoreline{animation:rise .5s .65s both}.enter .reward:nth-child(1){animation:show .65s .9s forwards}.enter .reward:nth-child(2){animation:show .65s 1.22s forwards}.enter .reward:nth-child(3){animation:show .65s 1.54s forwards}.enter .reward:nth-child(4){animation:show .65s 1.86s forwards}.enter .details{animation:show .5s 2.3s forwards}.enter .foot{animation:show .5s 2.55s forwards}.sparks{position:absolute;inset:0;pointer-events:none;overflow:hidden}.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#d2c0ff;box-shadow:0 0 10px #ccb3ff;opacity:0}.enter .spark{animation:float 2.5s var(--delay) both}.s1{top:22%;left:13%;--delay:.4s}.s2{top:17%;left:83%;--delay:.7s}.s3{top:39%;left:20%;--delay:.9s}.s4{top:11%;left:38%;--delay:1s}.s5{top:29%;left:76%;--delay:.6s}.s6{top:45%;left:90%;--delay:1.2s}@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.93);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}@keyframes show{to{opacity:1;transform:none}}@keyframes glow{50%{filter:drop-shadow(0 0 25px #ae95fb62)}}@keyframes float{0%{opacity:0;transform:translateY(20px) scale(.2)}28%{opacity:1}100%{opacity:0;transform:translateY(-95px) translateX(20px) scale(0)}}@media(max-width:390px){.switcher button{padding:9px 9px;font-size:11px}.modal{border-radius:23px}.rewards{gap:7px;margin-inline:14px}.reward{padding:9px 8px;gap:7px}.rIcon{width:30px;height:30px;flex-basis:30px}.rIcon svg{width:18px;height:18px}.rInfo strong{font-size:18px}.details{margin-inline:14px}.sectionTitle{margin-inline:17px}.foot{padding-inline:14px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0ms!important;transition:none!important}.reward,.details,.foot{opacity:1;transform:none}}
/* Tema claro Orbit, preservando o mesmo popup e suas animações */
body.light{color-scheme:light;--bg:#f3f3f8;--line:#dedbea;--muted:#777487;--white:#282639;background:radial-gradient(ellipse at 50% 0%,#e8e2ff,#f3f3f8 58%,#f7f7fb)}
body.light .stage:before{background:radial-gradient(circle at 50% 48%,transparent 0%,#f3f3f880 75%)}
body.light .switcher{background:#ffffffef;border-color:#dedbea;box-shadow:0 12px 35px #645b8a20}
body.light .switcher button{color:#69617e}body.light .switcher button.active{background:#ede9fd;color:#493ab1;box-shadow:inset 0 1px #fff}
body.light .modal{background:linear-gradient(155deg,#fff 0%,#faf9ff 48%,#f6f5fc 100%);border-color:#e4dfef;box-shadow:0 25px 100px #42377625,0 0 65px #a38bea13,inset 0 1px #fff}
body.light .brand{color:#453c60}body.light .brandmark{color:#6753b7}body.light .mini{color:#8c86a3}
body.light .hero h1{background-image:linear-gradient(#433262,#8465d3)}body.light .lose .hero h1{background-image:linear-gradient(#633345,#c56884)}body.light .session .hero h1{background-image:linear-gradient(#2e507d,#6296ce)}
body.light .hero p{color:#746d89}body.light .eyebrow{color:#8265ba}body.light .scoreline{background:#f3effe;color:#66607d;border-color:#e6dff7}
body.light .sectionTitle span{color:#3d3653}body.light .sectionTitle small{color:#857e9a}
body.light .reward{background:linear-gradient(125deg,#fff,#faf9ff);border-color:#e6e1f0;box-shadow:0 5px 18px #7562ab08}body.light .rInfo small{color:#69617e}body.light .rInfo em{color:#88809e}
body.light .details{background:#f8f6fd;border-color:#e7e1f0}body.light .detailsBtn{color:#463b60}body.light .detailsBody{border-top-color:#e6e0ef}body.light .calcRow{color:#716882}body.light .calcRow b{color:#332c49}body.light .calcRow.total{color:#3d3552;border-top-color:#e4dff0}body.light .calcRow.total b{color:#33876b}
body.light .again{color:#5a4c81;background:#f5f1ff;border-color:#ded3f7}
.themeToggle{border:1px solid var(--line);background:#22253a;color:#ece9ff;border-radius:30px;padding:10px 13px;font-size:12px;white-space:nowrap}body.light .themeToggle{background:#f0ecfb;color:#4d3a91}
.switcher{flex-wrap:wrap;justify-content:center;width:max-content}.switcher .themeToggle{margin-left:5px}
@media(max-width:560px){.stage{padding-top:135px}.switcher{border-radius:22px;max-width:calc(100vw - 12px);width:calc(100vw - 16px)}.switcher button{flex:1 1 auto}.switcher .themeToggle{margin-left:0}}

.stage{padding:14px;min-height:100vh}.modal{margin:auto}body{background:transparent!important}.stage:before{display:none}.reward:nth-child(3){--c:#ffb25c}.receipt-note{font-size:11px;line-height:1.5;color:#8994b6;margin-top:12px}body.light .receipt-note{color:#61576f}
body.light .ring:before{border-color:#8d6ac2}body.light .ring:after{border-color:#a58bbf}body.light .medal svg{stroke:#6d51ac}body.light .medal{border-color:#9274c3;background:linear-gradient(145deg,#cbb7f655,#8f7bc822)}body.light .session .medal svg{stroke:#3f70a0}body.light .lose .medal svg{stroke:#ad5070}body.light .reward{border-color:#cbbfdf}body.light .rIcon{border-color:color-mix(in srgb,var(--c),#705a83 45%)}body.light .scoreline{border-color:#c7b8e0}body.light .details{border-color:#c8b9da}body.light .calcRow.total b{color:#6c45ab}body.light .spark{background:#9470c4;box-shadow:0 0 8px #a17aca}body.reduced *,body.reduced *:before,body.reduced *:after{animation:none!important;transition:none!important}body.reduced .reward,body.reduced .details,body.reduced .foot{opacity:1;transform:none}@media(max-width:560px){.stage{padding:8px}}
</style></head>
<body>

<main class="stage"><section class="modal enter" id="modal" aria-label="Popup de recompensas"><div class="aurora"></div><div class="sparks"><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i><i class="spark s5"></i><i class="spark s6"></i></div><div class="topline"><div class="brand"><span class="brandmark">✦</span> ENEMIZADES</div><span class="mini" id="type">COLISEU · COMET</span></div>
<div class="hero"><div class="ring"><div class="medal" id="medal"></div></div><div class="eyebrow" id="eyebrow">DUELO ENCERRADO</div><h1 id="headline">VITÓRIA</h1><p id="subline">Sua constelação avançou mais uma vez.</p><div class="scoreline"><span class="dot"></span><span id="summary">6 de 8 questões corretas</span></div></div>
<div class="sectionTitle"><span>SUAS RECOMPENSAS</span><small>PROGRESSO DA ATIVIDADE</small></div>
<div class="rewards"><div class="reward"><div class="rIcon" id="iPR"></div><div class="rInfo"><small>PR <button id="prExpand" aria-label="Detalhar cálculo de PR" aria-expanded="false" style="color:inherit;background:none;border:0;cursor:pointer">⌄</button></small><strong id="vPR">+120</strong><em>pontuação</em></div></div><div class="reward"><div class="rIcon" id="iXP"></div><div class="rInfo"><small>XP</small><strong id="vXP">+180</strong><em>experiência</em></div></div><div class="reward"><div class="rIcon" id="iSIN"></div><div class="rInfo"><small>Sinapse</small><strong id="vSIN">+4,2</strong><em>energia de estudo</em></div></div><div class="reward"><div class="rIcon" id="iORB"></div><div class="rInfo"><small>Orbes</small><strong id="vORB">+25</strong><em>moedas</em></div></div></div>
<div class="details" id="details"><button class="detailsBtn" id="toggle" aria-expanded="false"><span><span style="color:#bba9ff">✧</span> Como meu PR foi calculado?</span><svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 9 7 7 7-7"/></svg></button><div class="detailsBody" id="calc"></div></div>
<div class="foot"><button class="primary" id="close">Continuar</button><button class="again" id="again" aria-label="Repetir animação">↻ Repetir</button></div>
</section></main>
<script>
// Símbolos oficiais provenientes do arquivo enemizades-simbolos-orbit.html
let serial=0;
const indicators=[
{name:'Orbes',slug:'orbes',colors:['#ffe7aa','#efba62','#cd7953'],halo:'#efba6228',shadow:'#ca8c4028',desc:'Moedas · Núcleo luminoso',label:'RECOMPENSA'},
{name:'PR',slug:'pr',colors:['#cebaff','#9b7ce9','#6552d1'],halo:'#a18aee28',shadow:'#6552d128',desc:'Pontos de Rank · Avanço competitivo',label:'COMPETIÇÃO'},
{name:'XP',slug:'xp',colors:['#77e1ae','#42bdb8','#438dd8'],halo:'#54c4b526',shadow:'#42bdb828',desc:'Experiência · Progresso acumulado',label:'EVOLUÇÃO'},
{name:'Sinapse',slug:'sinapse',colors:['#ffd36b','#f69a44','#e96858'],halo:'#ee9e5028',shadow:'#e8914428',desc:'Intensidade · Raio de energia',label:'ATIVIDADE'}
];
function indicator(r,size){
 const id='ind'+serial++,mini=size<=24,large=size>=100,g=`url(#${id})`;
 let shape='',detail='';
 if(r.slug==='orbes'){
 shape=`<circle cx="32" cy="32" r="23" fill="${g}"/>`;
 detail=`<path d="M32 20Q34 29 44 32Q34 35 32 44Q30 35 20 32Q30 29 32 20Z" fill="white" opacity=".72"/>`;
 }else if(r.slug==='pr'){
 shape=`<path d="M16 27 32 13 48 27M16 47 32 33 48 47" fill="none" stroke="${g}" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>`;
 }else if(r.slug==='xp'){
 shape=`<path d="M32 13A19 19 0 1 0 51 32" fill="none" stroke="${g}" stroke-width="12" stroke-linecap="round"/><circle cx="46" cy="18" r="6" fill="${r.colors[2]}"/>`;
 }else{
 shape=`<path d="M35 7C37 4 41 6 40 9L35 25H48C51 25 52 28 50 30L27 57C25 60 21 58 22 55L27 39H14C11 39 10 36 12 34Z" fill="${g}"/>`;
 }
 return `<svg xmlns="http://www.w3.org/2000/svg" class="badge" width="${size}" height="${size}" viewBox="0 0 64 64" role="img" aria-label="${r.name}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${r.colors[0]}"/><stop offset=".5" stop-color="${r.colors[1]}"/><stop offset="1" stop-color="${r.colors[2]}"/></linearGradient>${large?`<mask id="${id}mask" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64" style="mask-type:alpha">${shape}</mask><linearGradient id="${id}sweep"><stop stop-color="white" stop-opacity="0"/><stop offset=".5" stop-color="white" stop-opacity=".55"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>`:''}</defs>${shape}${detail}${large?`<style>@keyframes orbit-sweep{0%,15%{transform:translateX(-45px)}65%,100%{transform:translateX(95px)}}.light-sweep{animation:orbit-sweep 6s cubic-bezier(.4,0,.2,1) infinite}@media(prefers-reduced-motion:reduce){.light-sweep{animation:none;opacity:0}}
.stage{padding:14px;min-height:100vh}.modal{margin:auto}body{background:transparent!important}.stage:before{display:none}.reward:nth-child(3){--c:#ffb25c}.receipt-note{font-size:11px;line-height:1.5;color:#8994b6;margin-top:12px}body.light .receipt-note{color:#61576f}
body.light .ring:before{border-color:#8d6ac2}body.light .ring:after{border-color:#a58bbf}body.light .medal svg{stroke:#6d51ac}body.light .medal{border-color:#9274c3;background:linear-gradient(145deg,#cbb7f655,#8f7bc822)}body.light .session .medal svg{stroke:#3f70a0}body.light .lose .medal svg{stroke:#ad5070}body.light .reward{border-color:#cbbfdf}body.light .rIcon{border-color:color-mix(in srgb,var(--c),#705a83 45%)}body.light .scoreline{border-color:#c7b8e0}body.light .details{border-color:#c8b9da}body.light .calcRow.total b{color:#6c45ab}body.light .spark{background:#9470c4;box-shadow:0 0 8px #a17aca}body.reduced *,body.reduced *:before,body.reduced *:after{animation:none!important;transition:none!important}body.reduced .reward,body.reduced .details,body.reduced .foot{opacity:1;transform:none}@media(max-width:560px){.stage{padding:8px}}
</style><g mask="url(#${id}mask)"><g class="light-sweep"><path d="M-22-8H-4L28 72H10Z" fill="url(#${id}sweep)"/></g></g>`:''}</svg>`;
}


const medalIcons={session:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',win:'<path d="M7 4h10v6a5 5 0 0 1-10 0zM7 6H4v2a4 4 0 0 0 4 4m9-6h3v2a4 4 0 0 1-4 4M12 15v5m-4 0h8"/>',lose:'<path d="m5 5 14 14M19 5 5 19"/><circle cx="12" cy="12" r="10"/>'};
const node=id=>document.getElementById(id),format=v=>Number(v).toLocaleString('pt-BR',{maximumFractionDigits:2}),set=(id,value)=>node(id).textContent=value;
let receipt=null;
function show(data){receipt=data;document.body.classList.toggle('light',data.light);const root=node('modal');root.className='modal '+(data.mode==='win'?'':data.mode==='lose'?'lose':'session');set('type',data.type||'ATIVIDADE');set('eyebrow',data.heading||'PROGRESSO REGISTRADO');set('headline',data.title||'SESSÃO CONCLUÍDA');set('subline',data.subtitle||'Cada atividade conta na sua jornada.');set('summary',data.summary||'');node('medal').innerHTML='<svg viewBox="0 0 24 24">'+medalIcons[data.mode||'session']+'</svg>';
 ['PR','XP','SIN','ORB'].forEach((k,i)=>{node('i'+k).innerHTML=indicator(indicators[[1,2,3,0][i]],30);const value=data.values[i];set('v'+k,value==null?'—':(value>=0?'+':'')+format(value));});
 node('vORB').nextElementSibling.textContent=data.values[3]==null?'regra não confirmada':'moedas';
 const calc=node('calc');calc.replaceChildren();for(const [label,value] of data.calcs){const row=document.createElement('div');row.className='calcRow';const l=document.createElement('span'),v=document.createElement('b');l.textContent=label;v.textContent=value;row.append(l,v);calc.append(row);}if(data.note){const n=document.createElement('p');n.className='receipt-note';n.textContent=data.note;calc.append(n);}node('details').classList.remove('open');node('toggle').setAttribute('aria-expanded','false');
 root.style.setProperty('--motion',data.reduced?'none':'');document.body.classList.toggle('reduced',data.reduced);void root.offsetWidth;root.classList.add('enter');node('close').focus();}
window.addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin||e.data?.type!=='orbit-receipt')return;show(e.data.receipt);});
node('prExpand').onclick=()=>node('toggle').click();node('toggle').onclick=()=>{node('details').classList.toggle('open');node('toggle').setAttribute('aria-expanded',String(node('details').classList.contains('open')));node('prExpand').setAttribute('aria-expanded',String(node('details').classList.contains('open')));};node('again').onclick=()=>show(receipt);node('close').onclick=()=>parent.postMessage({type:'orbit-receipt-close'},location.origin);document.addEventListener('keydown',e=>{if(e.key==='Escape')node('close').click();});
parent.postMessage({type:'orbit-receipt-ready'},location.origin);
</script></body></html>
